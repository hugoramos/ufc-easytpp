pipeline_config_id: runner_config

data:
  amazon:
    data_format: json
    train_dir: easytpp/amazon
    valid_dir: easytpp/amazon
    test_dir: easytpp/amazon
    data_specs:
      num_event_types: 16
      pad_token_id: 16
      padding_side: right
      truncation_side: right
      max_len: 100

NHP_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: amazon
    runner_id: std_tpp
    model_id: NHP
    base_dir: './checkpoints_nhp/'
  trainer_config:
    batch_size: 256
    max_epoch: 10
    shuffle: False
    optimizer: adam
    learning_rate: 1.e-3
    valid_freq: 1
    use_tfb: False
    metrics: ['acc', 'rmse']
    seed: 2019
    gpu: -1
  model_config:
    hidden_size: 64
    loss_integral_num_sample_per_step: 20
    thinning:
      num_seq: 10
      num_sample: 1
      num_exp: 500
      look_ahead_time: 10
      patience_counter: 5
      over_sample_rate: 5
      num_samples_boundary: 5
      dtime_max: 10
      num_step_gen: 1

