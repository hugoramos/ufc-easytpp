SAHP_train:
  base_config:
    backend: torch
    base_dir: ./checkpoints_stackoverflow/
    dataset_id: stackoverflow
    model_id: SAHP
    runner_id: std_tpp
    stage: train
  model_config:
    dropout: 0.1
    hidden_size: 64
    num_heads: 2
    num_layers: 2
    thinning_params:
      dtime_max: 10
      look_ahead_time: 10
      num_exp: 500
      num_sample: 1
      num_samples_boundary: 5
      num_seq: 10
      over_sample_rate: 5
      patience_counter: 5
    time_emb_size: 16
    use_ln: false
  trainer_config:
    batch_size: 256
    gpu: -1
    learning_rate: 0.001
    max_epoch: 10
    metrics:
    - acc
    - rmse
    optimizer: adam
    seed: 2019
    use_tfb: false
    valid_freq: 1
data:
  stackoverflow:
    data_format: pkl
    data_specs:
      max_len: 200
      num_event_types: 10
      pad_token_id: 10
      padding_side: right
      truncation_side: right
    test_dir: ./data/stackoverflow/test.pkl
    train_dir: ./data/stackoverflow/train.pkl
    valid_dir: ./data/stackoverflow/dev.pkl
pipeline_config_id: runner_config
